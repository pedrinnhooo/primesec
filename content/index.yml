  items:
    - i-simple-icons-nuxtdotjs
    - i-simple-icons-vuedotjs
    - i-simple-icons-react
    - i-simple-icons-typescript
    - i-simple-icons-amazonaws
features:
  headline: Serviços
  title: "Do código à conformidade."
  description: "Catálogo completo dos dois departamentos, engenharia de software e segurança da informação, com a nomenclatura usada no mercado."
  items:
    - icon: i-lucide-panel-top
      title: Desenvolvimento Frontend
      description: "Interfaces web modernas e responsivas com Vue, React e Nuxt. Foco em performance, acessibilidade, design system e entrega contínua."
    - icon: i-lucide-smartphone
      title: Desenvolvimento Mobile
      description: "Aplicativos nativos e multiplataforma para iOS e Android, com integração a APIs, notificações, autenticação e experiência fluida em produção."
    - icon: i-lucide-server
      title: Backend e APIs
      description: "APIs REST e GraphQL, microsserviços, autenticação, filas e bancos de dados. Arquitetura escalável, observável e pronta para crescer."
    - icon: i-lucide-cloud
      title: DevOps e Cloud
      description: "Pipelines de CI/CD, containers, infraestrutura como código e ambientes em nuvem como a AWS, com monitoramento e deploys seguros."
    - icon: i-lucide-blocks
      title: Arquitetura de Software
      description: "Desenho de soluções, modernização de sistemas legados e padrões de integração, com decisões técnicas alinhadas a custo, prazo e segurança."
    - icon: i-lucide-pen-tool
      title: UX/UI e Produto Digital
      description: "Fluxos, protótipos e interfaces que transformam regras de negócio em produto usável, do discovery à implementação com o time de engenharia."
    - icon: i-lucide-bug
      title: Pentest (Teste de Invasão)
      description: "Avaliação controlada de vulnerabilidades em aplicações web, mobile, APIs e redes (VAPT), com relatório técnico e recomendações de correção."
    - icon: i-lucide-swords
      title: Red Team
      description: "Segurança ofensiva avançada com simulação de adversários reais, testando pessoas, processos e tecnologia muito além do pentest tradicional."
    - icon: i-lucide-shield
      title: Blue Team
      description: "Segurança defensiva com hardening, monitoramento, detecção, resposta a incidentes e apoio à operação de SOC para reduzir o impacto de ameaças."
    - icon: i-lucide-blend
      title: Purple Team
      description: "Exercícios colaborativos entre ataque e defesa para validar controles e melhorar a detecção, com base em frameworks como o MITRE ATT&CK."
    - icon: i-lucide-file-lock-2
      title: Adequação à LGPD
      description: "Programa de privacidade e proteção de dados: mapeamento de tratamentos, políticas, bases legais, direitos do titular e adequação operacional à lei."
    - icon: i-lucide-scale
      title: GRC (Governança, Risco e Conformidade)
      description: "Governança, gestão de riscos e conformidade (Governance, Risk and Compliance), com políticas, controles, gap analysis e apoio a normas como ISO 27001 e NIST."
metrics:
  headline: Como atuamos
  title: "Dois departamentos. Uma entrega."
  description: "Engenharia e especialistas em segurança no mesmo fluxo: do build seguro ao pentest, da operação defendida à conformidade documentada."
  items:
    - value: "2"
      label: Departamentos
      class: "text-success"
    - value: "12"
      label: Linhas de serviço
      class: "text-primary"
    - value: "SI"
      label: Ofensiva, defensiva e GRC
      class: "text-info"
    - value: "E2E"
      label: Do produto ao compliance
      class: "text-warning"
cta:
  title: "Vamos estruturar\no próximo passo?"
  description: "Conte o seu desafio, seja produto, app, API, pentest, Red ou Blue Team, LGPD ou GRC. A gente define a frente certa e o escopo com você."
  command: priimesec@gmail.com
  links:
    - label: Falar conosco
      color: primary
      to: '/contato'
